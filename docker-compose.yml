services:
  # -------------------------------------------------------------
  # Database Service (Self-Hosted MongoDB 7)
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: voraeclat-mongodb
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 0.5
    volumes:
      - voraeclat_mongodb_data:/data/db
      - voraeclat_mongodb_config:/data/configdb
    networks:
      - voraeclat-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # Backend API Service (Node.js / Express / MERN MVC)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voraeclat-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/voraeclat}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/voraeclat}
      - JWT_SECRET=voraeclat_super_secure_jwt_secret_key_2026
      - CLIENT_URL=http://localhost
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-onboarding@resend.dev}
    volumes:
      - ./backend/public/uploads:/app/public/uploads
    networks:
      - voraeclat-network

  # -------------------------------------------------------------
  # Frontend Client Service (React / Vite compiled, served by Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voraeclat-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    networks:
      - voraeclat-network

volumes:
  voraeclat_mongodb_data:
  voraeclat_mongodb_config:

networks:
  voraeclat-network:
    driver: bridge

